<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Track your order</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<body>
<header class="pg-head"><div class="pg-head-in"><a class="pg-brand" href="index.html" data-brand>ToteNest</a><a class="pg-back" href="index.html">Back to shop</a></div></header>
<main class="prose">
<h1>Track your order</h1>
<p>Enter your order number and the phone number you used when you ordered.</p>
<form id="trackForm" class="tr-form" novalidate>
  <label for="tr_order">Order number</label>
  <input id="tr_order" name="order" type="text" placeholder="ORD-1001" autocomplete="off" autocapitalize="characters">
  <label for="tr_phone">Phone number</label>
  <input id="tr_phone" name="phone" type="tel" placeholder="0801 234 5678" autocomplete="tel">
  <div class="tr-error" id="trError" role="alert"></div>
  <button type="submit" class="tr-btn" id="trBtn">Track order</button>
</form>
<div id="trackResult" aria-live="polite"></div>
</main>
<footer class="pg-foot"><div class="pg-foot-in"><a href="pages/about.html">About us</a><a href="pages/terms.html">Terms and conditions</a><a href="pages/returns.html">Returns and exchanges</a><a href="pages/delivery.html">Delivery</a><a href="pages/privacy.html">Privacy</a><a href="index.html">Back to shop</a></div></footer>
<script src="js/vendor/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/track.js"></script>
</body>
</html>
